name: Update hourly news briefing

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-news-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh the eight headline categories
        run: python scripts/update_news.py
      - name: Commit updated headlines
        run: |
          if git diff --quiet -- docs/news.html; then
            echo "No headline changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news.html
          git commit -m "chore: refresh hourly news briefing"
          git push
